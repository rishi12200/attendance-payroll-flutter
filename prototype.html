<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Attendance & Payroll Register</title>
<style>
  :root{
    --paper:#F7F3E9;
    --paper-deep:#EFE8D7;
    --ink:#20242C;
    --muted:#726A5C;
    --line:#D8CFB8;
    --navy:#1C2B45;
    --navy-light:#2C4066;
    --gold:#B8862F;
    --gold-soft:#EADFC2;
    --rust:#A23F2E;
    --rust-soft:#F1DCD6;
    --leaf:#3E6B4C;
    --leaf-soft:#DCE9DE;
    --amber:#B98A1E;
    --amber-soft:#F3E5C4;
    --slate:#5A6B82;
    --slate-soft:#DCE3EC;
    font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{min-height:100vh;}
  h1,h2,h3{font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; font-weight:600; margin:0;}
  .mono{font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px; flex-shrink:0; background:var(--navy); color:#EDE7D6;
    display:flex; flex-direction:column; padding:22px 0;
  }
  .brand{padding:0 20px 18px 20px; border-bottom:1px solid rgba(237,231,214,0.14); margin-bottom:10px;}
  .brand .mark{font-family:Georgia, serif; font-size:20px; letter-spacing:0.3px; color:#F4EFE0;}
  .brand .sub{font-size:11px; color:#9AA6BC; margin-top:3px;}
  .nav-item{
    padding:11px 20px; font-size:14px; cursor:pointer; color:#C6CEDC;
    border-left:3px solid transparent; display:flex; align-items:center; gap:10px;
  }
  .nav-item:hover{background:rgba(255,255,255,0.04); color:#EDE7D6;}
  .nav-item.active{background:rgba(184,134,47,0.15); border-left-color:var(--gold); color:#F4EFE0; font-weight:600;}
  .nav-glyph{width:16px; display:inline-block; text-align:center; font-size:13px; opacity:0.85;}
  .sidebar-foot{margin-top:auto; padding:14px 20px 0 20px; font-size:11px; color:#7C879C; border-top:1px solid rgba(237,231,214,0.1);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--paper); border-bottom:1px solid var(--line); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .topbar h1{font-size:21px; color:var(--navy);}
  .topbar .tag{font-size:12px; color:var(--muted); margin-top:2px;}
  .controls{display:flex; align-items:center; gap:10px;}
  .month-input, .co-input{
    font-family: ui-monospace, monospace; font-size:13px; border:1px solid var(--line); background:#fff;
    padding:7px 10px; border-radius:3px; color:var(--ink);
  }
  .content{padding:26px 28px 60px 28px; flex:1;}

  /* ---------- Cards / dashboard ---------- */
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px; padding:16px 18px;
    border-top:3px solid var(--gold);
  }
  .card .num{font-family:Georgia, serif; font-size:28px; color:var(--navy); line-height:1.1;}
  .card .label{font-size:12px; color:var(--muted); margin-top:6px;}
  .card.rust{border-top-color:var(--rust);}
  .card.leaf{border-top-color:var(--leaf);}
  .card.slate{border-top-color:var(--slate);}

  .section-title{font-size:15px; color:var(--navy); margin:26px 0 10px 0; padding-bottom:6px; border-bottom:1px solid var(--line);}

  /* ---------- Tables (ledger feel) ---------- */
  table{width:100%; border-collapse:collapse; background:#fff;}
  .ledger{border:1px solid var(--line);}
  .ledger th{
    background:var(--navy); color:#EDE7D6; font-size:11.5px; text-align:left; padding:9px 10px;
    font-weight:600; letter-spacing:0.2px; white-space:nowrap;
  }
  .ledger td{padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
  .ledger tbody tr:hover{background:var(--paper-deep);}
  .ledger tbody tr:last-child td{border-bottom:none;}
  .status-pill{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;
  }
  .pill-active{background:var(--leaf-soft); color:var(--leaf);}
  .pill-resigned{background:var(--rust-soft); color:var(--rust);}

  /* ---------- Attendance register grid ---------- */
  .att-wrap{overflow-x:auto; border:1px solid var(--line); background:#fff;}
  .att-table{border-collapse:collapse; font-size:12px;}
  .att-table th, .att-table td{border:1px solid var(--line); text-align:center; padding:0;}
  .att-table th{background:var(--navy); color:#EDE7D6; font-weight:600; padding:6px 4px; font-size:10.5px;}
  .att-table .emp-col{position:sticky; left:0; background:#fff; z-index:2; text-align:left; padding:7px 10px; font-size:12.5px; min-width:170px; border-right:2px solid var(--line);}
  .att-table th.emp-col{background:var(--navy); z-index:3;}
  .day-cell{width:26px; height:30px; cursor:pointer; font-weight:700; font-size:11px; user-select:none;}
  .day-cell.sun{background:var(--paper-deep); color:var(--muted); cursor:default;}
  .day-cell.present{color:var(--leaf);}
  .day-cell.A{background:var(--rust-soft); color:var(--rust);}
  .day-cell.H{background:var(--amber-soft); color:var(--amber);}
  .day-cell.L{background:var(--slate-soft); color:var(--slate);}
  .sum-col{min-width:46px; font-size:11.5px; background:var(--paper-deep); font-weight:600;}
  .legend{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .swatch{width:12px; height:12px; border-radius:2px; display:inline-block;}

  /* ---------- Payroll table ---------- */
  .num-cell{text-align:right; font-family:ui-monospace,monospace; font-size:12.5px;}
  .adj-input{width:78px; text-align:right; font-family:ui-monospace,monospace; font-size:12px; border:1px solid var(--line); border-radius:3px; padding:4px 6px;}
  .link-btn{background:none; border:none; color:var(--navy); text-decoration:underline; cursor:pointer; font-size:12.5px; padding:0; font-family:inherit;}
  .net-pos{color:var(--leaf); font-weight:700;}

  /* ---------- Payslip ---------- */
  .payslip-overlay{
    position:fixed; inset:0; background:rgba(28,32,40,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:36px 16px; overflow-y:auto; z-index:50;
  }
  .payslip{
    background:#fff; width:720px; max-width:100%; border:1px solid var(--line); padding:34px 38px;
  }
  .payslip-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--navy); padding-bottom:14px; margin-bottom:18px;}
  .payslip-head h2{color:var(--navy); font-size:20px;}
  .payslip-head .period{font-size:13px; color:var(--muted); margin-top:4px;}
  .payslip-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; font-size:13px; margin-bottom:18px;}
  .payslip-grid div span.k{color:var(--muted);}
  .pay-cols{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  .pay-cols h3{font-size:12.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:8px;}
  .pay-row{display:flex; justify-content:space-between; font-size:13px; padding:3px 0;}
  .pay-row.total{border-top:1px solid var(--line); margin-top:6px; padding-top:7px; font-weight:700;}
  .net-box{margin-top:20px; background:var(--gold-soft); border:1px solid var(--gold); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-radius:3px;}
  .net-box .big{font-family:Georgia,serif; font-size:22px; color:var(--navy);}
  .close-row{display:flex; justify-content:flex-end; gap:10px; margin-bottom:14px;}
  .btn{
    font-size:12.5px; padding:7px 14px; border-radius:3px; border:1px solid var(--navy); background:var(--navy);
    color:#EDE7D6; cursor:pointer; font-family:inherit;
  }
  .btn.ghost{background:#fff; color:var(--navy);}
  .note{font-size:11px; color:var(--muted); margin-top:16px; line-height:1.5; border-top:1px dashed var(--line); padding-top:10px;}

  /* ---------- Add employee form ---------- */
  .add-emp-form{background:#fff; border:1px solid var(--line); border-top:3px solid var(--gold); padding:16px 18px 4px 18px; margin-bottom:18px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:10px 16px;}
  .form-grid label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--muted);}
  .form-grid input, .form-grid select{
    font-family:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:3px; color:var(--ink); background:var(--paper);
  }
  .form-grid input:focus, .form-grid select:focus{outline:2px solid var(--gold); outline-offset:1px;}

  /* ---------- Role switcher ---------- */
  .role-switch{display:flex; align-items:center; gap:8px;}
  .role-switch select{
    font-size:12.5px; padding:7px 10px; border-radius:3px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-family:inherit;
  }
  .role-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap;}

  @media print{
    .sidebar, .topbar, .close-row, .no-print{display:none !important;}
    .payslip-overlay{position:static; background:none; padding:0;}
    .payslip{border:none; width:auto;}
    body{background:#fff;}
  }
</style>

  const STATUS_CYCLE = ['', 'A', 'H', 'L'];
  const STATUS_LABEL = {'':'Present','A':'Absent','H':'Half Day','L':'Leave (Paid)'};

  /* ============ STATE ============ */
  const state = {
    view: 'dashboard',
    month: new Date().toISOString().slice(0,7),
    companyName: 'PrismBeamz',
    employees: [],
    role: 'user',
    showAddForm: false,
    attendance: {},
    adjustments: {},
    payslipEmpId: null,
    ready: false,
  };

  /* ============ STORAGE ============ */
  async function safeGet(key){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function safeSet(key, value){
    try{ await window.storage.set(key, value); }catch(e){ console.error('storage set failed', key, e); }
  }

  async function loadMonth(month){
    const [att, adj] = await Promise.all([
      safeGet('attendance:'+month),
      safeGet('adjustments:'+month),
    ]);
    state.attendance = att ? JSON.parse(att) : {};
    state.adjustments = adj ? JSON.parse(adj) : {};
  }

  async function persistAttendance(){ await safeSet('attendance:'+state.month, JSON.stringify(state.attendance)); }
  async function persistAdjustments(){ await safeSet('adjustments:'+state.month, JSON.stringify(state.adjustments)); }

  async function loadEmployees(){
    const raw = await safeGet('employees');
    if(raw){
      try{ state.employees = JSON.parse(raw); return; }catch(e){ /* fall through to seed */ }
    }
    state.employees = SEED_EMPLOYEES.slice();
    await safeSet('employees', JSON.stringify(state.employees));
  }
  async function persistEmployees(){ await safeSet('employees', JSON.stringify(state.employees)); }

  function nextEmployeeId(){
    let max = 0;
    state.employees.forEach(e => {
      const m = /^EMP-(\d+)$/.exec(e.id);
      if(m) max = Math.max(max, parseInt(m[1], 10));
    });
    return 'EMP-' + String(max + 1).padStart(3, '0');
  }

  async function init(){
    const co = await safeGet('company-name');
    if(co) state.companyName = co;
    const role = await safeGet('role-preference');
    if(role === 'admin' || role === 'user') state.role = role;
    await loadEmployees();
    await loadMonth(state.month);
    state.ready = true;
    render();
  }

  /* ============ HELPERS ============ */
  function daysInMonth(month){ const [y,m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
  function isSunday(month, day){ const [y,m] = month.split('-').map(Number); return new Date(y, m-1, day).getDay() === 0; }
  function weekdayLetter(month, day){ const [y,m] = month.split('-').map(Number); return ['S','M','T','W','T','F','S'][new Date(y,m-1,day).getDay()]; }
  function fmtINR(n){ return '\u20b9' + Math.round(n).toLocaleString('en-IN'); }
  function fmtMonthLabel(month){
    const [y,m] = month.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleString('en-IN', {month:'long', year:'numeric'});
  }
  function activeEmployees(){ return state.employees.filter(e => e.status === 'Active'); }

  function attendanceSummary(empId, month){
    const dim = daysInMonth(month);
    let workingDays=0, present=0, absent=0, half=0, leave=0, lop=0;
    const rec = state.attendance[empId] || {};
    for(let d=1; d<=dim; d++){
      if(isSunday(month, d)) continue;
      workingDays++;
      const s = rec[d] || '';
      if(s==='A'){ absent++; lop += 1; }
      else if(s==='H'){ half++; lop += 0.5; }
      else if(s==='L'){ leave++; }
      else { present++; }
    }
    return {workingDays, present, absent, half, leave, lop};
  }

  function professionalTax(monthlyGross){
    if(monthlyGross<=21000) return 0;
    if(monthlyGross<=30000) return 135;
    if(monthlyGross<=45000) return 315;
    if(monthlyGross<=60000) return 690;
    if(monthlyGross<=75000) return 1025;
    return 1250;
  }

  function computePayroll(emp, month){
    const summary = attendanceSummary(emp.id, month);
    const monthlyGross = emp.ctc / 12;
    const basic = monthlyGross * 0.5;
    const hra = basic * 0.4;
    const special = monthlyGross - basic - hra;
    const frac = summary.workingDays > 0 ? Math.max(0, (summary.workingDays - summary.lop) / summary.workingDays) : 1;
    const earnedGross = monthlyGross * frac;
    const earnedBasic = basic * frac;
    const earnedHra = hra * frac;
    const earnedSpecial = special * frac;
    const pf = earnedBasic * 0.12;
    const esi = monthlyGross <= 21000 ? earnedGross * 0.0075 : 0;
    const pt = professionalTax(monthlyGross);
    const adj = state.adjustments[emp.id] || {bonus:0, otherDeduction:0, remarks:''};
    const bonus = Number(adj.bonus) || 0;
    const otherDeduction = Number(adj.otherDeduction) || 0;
    const totalDeductions = pf + esi + pt + otherDeduction;
    const netPay = earnedGross + bonus - totalDeductions;
    return {summary, monthlyGross, basic, hra, special, earnedGross, earnedBasic, earnedHra, earnedSpecial, pf, esi, pt, bonus, otherDeduction, totalDeductions, netPay};
  }

  /* ============ EVENT HANDLERS ============ */
  window._app = {
    setView(v){ state.view = v; state.payslipEmpId = null; render(); },
    async setMonth(v){ state.month = v; await loadMonth(v); render(); },
    async setCompanyName(v){ state.companyName = v; await safeSet('company-name', v); render(); },
    async cycleDay(empId, day){
      if(!state.attendance[empId]) state.attendance[empId] = {};
      const cur = state.attendance[empId][day] || '';
      const idx = STATUS_CYCLE.indexOf(cur);
      const next = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
      if(next === '') delete state.attendance[empId][day];
      else state.attendance[empId][day] = next;
      await persistAttendance();
      render();
    },
    async setAdj(empId, field, value){
      if(!state.adjustments[empId]) state.adjustments[empId] = {bonus:0, otherDeduction:0, remarks:''};
      state.adjustments[empId][field] = field === 'remarks' ? value : (Number(value) || 0);
      await persistAdjustments();
      render();
    },
    openPayslip(empId){ state.payslipEmpId = empId; render(); },
    closePayslip(){ state.payslipEmpId = null; render(); },
    printPayslip(){ window.print(); },
    async setRole(v){
      state.role = v;
      state.showAddForm = false;
      await safeSet('role-preference', v);
      render();
    },
    toggleAddForm(){ state.showAddForm = !state.showAddForm; render(); },
    async addEmployee(evt){
      evt.preventDefault();
      if(state.role !== 'admin') return;
      const f = evt.target;
      const emp = {
        id: nextEmployeeId(),
        name: f.name.value.trim(),
        gender: f.gender.value,
        dob: f.dob.value,
        doj: f.doj.value,
        designation: f.designation.value.trim(),
        department: f.department.value.trim(),
        manager: f.manager.value.trim(),
        email: f.email.value.trim(),
        mobile: f.mobile.value.trim(),
        pan: f.pan.value.trim(),
        uan: f.uan.value.trim(),
        bank: f.bank.value.trim(),
        ifsc: f.ifsc.value.trim(),
        ctc: Number(f.ctc.value) || 0,
        status: f.status.value,
      };
      state.employees.push(emp);
      await persistEmployees();
      state.showAddForm = false;
      render();
    },
    async deleteEmployee(empId){
      if(state.role !== 'admin') return;
      const emp = state.employees.find(x => x.id === empId);
      if(!emp) return;
      if(!window.confirm('Remove ' + emp.name + ' (' + empId + ') from the employee record? This cannot be undone.')) return;
      state.employees = state.employees.filter(x => x.id !== empId);
      await persistEmployees();
      render();
    },
  };

  /* ============ RENDER: SUBVIEWS ============ */

  function renderSidebar(){
    const items = [
      {k:'dashboard', label:'Dashboard', g:'\u25a4'},
      {k:'employees', label:'Employees', g:'\u2630'},
      {k:'attendance', label:'Attendance Register', g:'\u2637'},
      {k:'payroll', label:'Payroll', g:'\u20b9'},
    ];
    return `
      <div class="sidebar">
        <div class="brand">
          <div class="mark">${escapeHtml(state.companyName)}</div>
          <div class="sub">Attendance &amp; Payroll Register</div>
        </div>
        ${items.map(it => `
          <div class="nav-item ${state.view===it.k?'active':''}" onclick="_app.setView('${it.k}')">
            <span class="nav-glyph">${it.g}</span>${it.label}
          </div>
        `).join('')}
        <div class="sidebar-foot">Working model &mdash; demo data.<br/>Admin role can add or remove employees. Statutory figures are illustrative.</div>
      </div>
    `;
  }

  function renderTopbar(){
    const titles = {
      dashboard: ['Dashboard', 'Overview for the selected period'],
      employees: ['Employee Master', 'Read-only record sourced from the employee database'],
      attendance: ['Attendance Register', 'Click a working day to cycle Present \u2192 Absent \u2192 Half Day \u2192 Leave'],
      payroll: ['Payroll', 'Computed from attendance, CTC structure and simplified statutory rules'],
    };
    const [t, s] = titles[state.view] || ['', ''];
    const showMonth = state.view !== 'employees';
    return `
      <div class="topbar">
        <div>
          <h1>${t}</h1>
          <div class="tag">${s}</div>
        </div>
        <div class="controls">
          ${state.view==='dashboard' ? `<input class="co-input" style="width:220px" value="${escapeHtml(state.companyName)}" onchange="_app.setCompanyName(this.value)" title="Company name" />` : ''}
          ${showMonth ? `<input class="month-input" type="month" value="${state.month}" onchange="_app.setMonth(this.value)" />` : ''}
          <div class="role-switch">
            <span class="role-label">Signed in as</span>
            <select onchange="_app.setRole(this.value)">
              <option value="user" ${state.role==='user'?'selected':''}>User</option>
              <option value="admin" ${state.role==='admin'?'selected':''}>Admin</option>
            </select>
          </div>
        </div>
      </div>
    `;
  }

  function renderDashboard(){
    const emps = activeEmployees();
    const summaries = emps.map(e => ({emp:e, pay: computePayroll(e, state.month)}));
    const totalCost = summaries.reduce((a,s)=>a+s.pay.netPay, 0);
    const avgAttendance = summaries.length ? summaries.reduce((a,s)=>{
      const wd = s.pay.summary.workingDays || 1;
      return a + ((wd - s.pay.summary.lop)/wd);
    },0)/summaries.length*100 : 0;
    const totalLop = summaries.reduce((a,s)=>a+s.pay.summary.lop,0);
    const byDept = {};
    emps.forEach(e => { byDept[e.department] = (byDept[e.department]||0)+1; });

    return `
      <div class="grid-cards">
        <div class="card">
          <div class="num">${emps.length}</div>
          <div class="label">Active employees (of ${state.employees.length} total)</div>
        </div>
        <div class="card leaf">
          <div class="num">${avgAttendance.toFixed(1)}%</div>
          <div class="label">Average attendance &mdash; ${fmtMonthLabel(state.month)}</div>
        </div>
        <div class="card rust">
          <div class="num">${totalLop}</div>
          <div class="label">Total loss-of-pay days this month</div>
        </div>
        <div class="card slate">
          <div class="num" style="font-size:22px;">${fmtINR(totalCost)}</div>
          <div class="label">Estimated net payroll payout</div>
        </div>
      </div>

      <div class="section-title">Headcount by department</div>
      <table class="ledger">
        <thead><tr><th>Department</th><th>Active headcount</th></tr></thead>
        <tbody>
          ${Object.entries(byDept).map(([d,c]) => `<tr><td>${escapeHtml(d)}</td><td class="mono">${c}</td></tr>`).join('')}
        </tbody>
      </table>

      <div class="section-title">Attendance snapshot &mdash; ${fmtMonthLabel(state.month)}</div>
      <table class="ledger">
        <thead><tr><th>Employee</th><th>Present</th><th>Absent</th><th>Half day</th><th>Leave</th><th>LOP days</th></tr></thead>
        <tbody>
          ${summaries.map(s => `
            <tr>
              <td>${escapeHtml(s.emp.name)}</td>
              <td class="mono">${s.pay.summary.present}</td>
              <td class="mono">${s.pay.summary.absent}</td>
              <td class="mono">${s.pay.summary.half}</td>
              <td class="mono">${s.pay.summary.leave}</td>
              <td class="mono">${s.pay.summary.lop}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function renderEmployees(){
    const isAdmin = state.role === 'admin';
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <div class="tag" style="font-size:12px; color:var(--muted);">
          ${state.employees.length} employees on record &middot; ${activeEmployees().length} active
        </div>
        ${isAdmin
          ? `<button class="btn" onclick="_app.toggleAddForm()">${state.showAddForm ? 'Cancel' : '+ Add Employee'}</button>`
          : `<div class="tag" style="font-size:12px; color:var(--muted);">Signed in as User &mdash; switch to Admin to add or remove employees</div>`
        }
      </div>
      ${isAdmin && state.showAddForm ? renderAddEmployeeForm() : ''}
      <table class="ledger">
        <thead>
          <tr>
            <th>Emp ID</th><th>Name</th><th>Designation</th><th>Department</th><th>Manager</th>
            <th>DOJ</th><th>Email</th><th>Mobile</th><th>CTC (Annual)</th><th>Status</th>${isAdmin ? '<th></th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${state.employees.map(e => `
            <tr>
              <td class="mono">${e.id}</td>
              <td>${escapeHtml(e.name)}</td>
              <td>${escapeHtml(e.designation)}</td>
              <td>${escapeHtml(e.department)}</td>
              <td>${escapeHtml(e.manager)}</td>
              <td class="mono">${e.doj}</td>
              <td class="mono">${e.email}</td>
              <td class="mono">${e.mobile}</td>
              <td class="num-cell">${fmtINR(e.ctc)}</td>
              <td><span class="status-pill ${e.status==='Active'?'pill-active':'pill-resigned'}">${e.status}</span></td>
              ${isAdmin ? `<td><button class="link-btn" style="color:var(--rust)" onclick="_app.deleteEmployee('${e.id}')">Remove</button></td>` : ''}
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function renderAddEmployeeForm(){
    return `
      <form class="add-emp-form" onsubmit="_app.addEmployee(event)">
        <div class="section-title" style="margin-top:0;">New employee</div>
        <div class="form-grid">
          <label>Full name<input name="name" required /></label>
          <label>Gender
            <select name="gender"><option value="M">M</option><option value="F">F</option><option value="Other">Other</option></select>
          </label>
          <label>Date of birth<input name="dob" type="date" required /></label>
          <label>Date of joining<input name="doj" type="date" required /></label>
          <label>Designation<input name="designation" required /></label>
          <label>Department<input name="department" required /></label>
          <label>Reporting manager<input name="manager" /></label>
          <label>Email<input name="email" type="email" required /></label>
          <label>Mobile<input name="mobile" required /></label>
          <label>PAN<input name="pan" /></label>
          <label>UAN<input name="uan" /></label>
          <label>Bank A/C<input name="bank" /></label>
          <label>IFSC<input name="ifsc" /></label>
          <label>CTC (Annual, \u20b9)<input name="ctc" type="number" min="0" required /></label>
          <label>Status
            <select name="status"><option value="Active">Active</option><option value="Resigned">Resigned</option><option value="Inactive">Inactive</option></select>
          </label>
        </div>
        <div class="close-row" style="margin-top:14px;">
          <button type="submit" class="btn">Save employee</button>
        </div>
      </form>
    `;
  }

  function renderAttendance(){
    const dim = daysInMonth(state.month);
    const emps = activeEmployees();
    const dayHeaders = [];
    for(let d=1; d<=dim; d++) dayHeaders.push(d);

    const headRow1 = `<tr>
      <th class="emp-col" rowspan="2">Employee</th>
      ${dayHeaders.map(d => `<th ${isSunday(state.month,d)?'style="background:var(--navy-light)"':''}>${d}</th>`).join('')}
      <th colspan="5">Summary</th>
    </tr>`;
    const headRow2 = `<tr>
      ${dayHeaders.map(d => `<th style="font-size:9px; ${isSunday(state.month,d)?'background:var(--navy-light)':''}">${weekdayLetter(state.month,d)}</th>`).join('')}
      <th style="font-size:9.5px;">P</th><th style="font-size:9.5px;">A</th><th style="font-size:9.5px;">H</th><th style="font-size:9.5px;">L</th><th style="font-size:9.5px;">LOP</th>
    </tr>`;

    const bodyRows = emps.map(e => {
      const rec = state.attendance[e.id] || {};
      const cells = dayHeaders.map(d => {
        if(isSunday(state.month, d)){
          return `<td class="day-cell sun">WO</td>`;
        }
        const s = rec[d] || '';
        const cls = s ? s : 'present';
        const label = s || 'P';
        return `<td class="day-cell ${cls}" onclick="_app.cycleDay('${e.id}', ${d})" title="${STATUS_LABEL[s]}">${label}</td>`;
      }).join('');
      const sum = attendanceSummary(e.id, state.month);
      return `<tr>
        <td class="emp-col">${escapeHtml(e.name)}<br/><span class="mono" style="color:var(--muted); font-size:10.5px;">${e.id}</span></td>
        ${cells}
        <td class="sum-col">${sum.present}</td>
        <td class="sum-col">${sum.absent}</td>
        <td class="sum-col">${sum.half}</td>
        <td class="sum-col">${sum.leave}</td>
        <td class="sum-col">${sum.lop}</td>
      </tr>`;
    }).join('');

    return `
      <div class="att-wrap">
        <table class="att-table">
          <thead>${headRow1}${headRow2}</thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:#fff;border:1px solid var(--line)"></span>Present</span>
        <span><span class="swatch" style="background:var(--rust-soft)"></span>Absent</span>
        <span><span class="swatch" style="background:var(--amber-soft)"></span>Half day</span>
        <span><span class="swatch" style="background:var(--slate-soft)"></span>Leave (paid)</span>
        <span><span class="swatch" style="background:var(--paper-deep)"></span>Weekly off (Sunday)</span>
      </div>
    `;
  }

  function renderPayroll(){
    const emps = activeEmployees();
    const rows = emps.map(e => {
      const p = computePayroll(e, state.month);
      const adj = state.adjustments[e.id] || {bonus:0, otherDeduction:0};
      return `
        <tr>
          <td>${escapeHtml(e.name)}<br/><span class="mono" style="color:var(--muted); font-size:10.5px;">${e.id}</span></td>
          <td class="num-cell">${fmtINR(p.monthlyGross)}</td>
          <td class="num-cell">${p.summary.lop}</td>
          <td class="num-cell">${fmtINR(p.earnedGross)}</td>
          <td class="num-cell">${fmtINR(p.pf)}</td>
          <td class="num-cell">${fmtINR(p.esi)}</td>
          <td class="num-cell">${fmtINR(p.pt)}</td>
          <td><input class="adj-input" type="number" min="0" value="${adj.bonus||0}" onchange="_app.setAdj('${e.id}','bonus',this.value)" /></td>
          <td><input class="adj-input" type="number" min="0" value="${adj.otherDeduction||0}" onchange="_app.setAdj('${e.id}','otherDeduction',this.value)" /></td>
          <td class="num-cell net-pos">${fmtINR(p.netPay)}</td>
          <td><button class="link-btn" onclick="_app.openPayslip('${e.id}')">Payslip</button></td>
        </tr>
      `;
    }).join('');

    const totalNet = emps.reduce((a,e)=>a+computePayroll(e,state.month).netPay, 0);

    return `
      <table class="ledger">
        <thead>
          <tr>
            <th>Employee</th><th>Monthly Gross</th><th>LOP days</th><th>Earned Gross</th>
            <th>PF</th><th>ESI</th><th>Prof. Tax</th><th>Bonus</th><th>Other Ded.</th><th>Net Pay</th><th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr>
            <td colspan="9" style="text-align:right; font-weight:600; padding:9px 10px;">Total net payout</td>
            <td class="num-cell" style="font-weight:700;">${fmtINR(totalNet)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
      <div class="note">
        Illustrative calculation for demo purposes: Basic = 50% of monthly gross, HRA = 40% of Basic, remainder as Special Allowance.
        PF = 12% of earned Basic. ESI = 0.75% of earned gross when monthly gross \u2264 \u20b921,000. Professional Tax follows a simplified
        slab. Loss-of-pay is charged per working day (Sundays treated as weekly off). This is not statutory or tax advice.
      </div>
    `;
  }

  function renderPayslip(){
    if(!state.payslipEmpId) return '';
    const e = state.employees.find(x => x.id === state.payslipEmpId);
    if(!e) return '';
    const p = computePayroll(e, state.month);
    return `
      <div class="payslip-overlay" onclick="if(event.target===this) _app.closePayslip()">
        <div class="payslip">
          <div class="close-row no-print">
            <button class="btn ghost" onclick="_app.printPayslip()">Print</button>
            <button class="btn" onclick="_app.closePayslip()">Close</button>
          </div>
          <div class="payslip-head">
            <div style="display:flex; align-items:center; gap:14px;">
              <img src="${LOGO_DATA_URL}" alt="${escapeHtml(state.companyName)} logo" style="width:44px; height:44px; object-fit:contain;" />
              <div>
                <h2>${escapeHtml(state.companyName)}</h2>
                <div class="period">Payslip for ${fmtMonthLabel(state.month)}</div>
              </div>
            </div>
            <div class="mono" style="text-align:right; font-size:12px; color:var(--muted);">${e.id}</div>
          </div>
          <div class="payslip-grid">
            <div><span class="k">Employee:</span> ${escapeHtml(e.name)}</div>
            <div><span class="k">Designation:</span> ${escapeHtml(e.designation)}</div>
            <div><span class="k">Department:</span> ${escapeHtml(e.department)}</div>
            <div><span class="k">Date of joining:</span> ${e.doj}</div>
            <div><span class="k">Bank A/C:</span> ${e.bank}</div>
            <div><span class="k">PAN:</span> ${e.pan}</div>
            <div><span class="k">Working days:</span> ${p.summary.workingDays}</div>
            <div><span class="k">LOP days:</span> ${p.summary.lop}</div>
          </div>
          <div class="pay-cols">
            <div>
              <h3>Earnings</h3>
              <div class="pay-row"><span>Basic</span><span class="mono">${fmtINR(p.earnedBasic)}</span></div>
              <div class="pay-row"><span>HRA</span><span class="mono">${fmtINR(p.earnedHra)}</span></div>
              <div class="pay-row"><span>Special allowance</span><span class="mono">${fmtINR(p.earnedSpecial)}</span></div>
              <div class="pay-row"><span>Bonus / incentive</span><span class="mono">${fmtINR(p.bonus)}</span></div>
              <div class="pay-row total"><span>Gross earnings</span><span class="mono">${fmtINR(p.earnedGross + p.bonus)}</span></div>
            </div>
            <div>
              <h3>Deductions</h3>
              <div class="pay-row"><span>Provident Fund</span><span class="mono">${fmtINR(p.pf)}</span></div>
              <div class="pay-row"><span>ESI</span><span class="mono">${fmtINR(p.esi)}</span></div>
              <div class="pay-row"><span>Professional tax</span><span class="mono">${fmtINR(p.pt)}</span></div>
              <div class="pay-row"><span>Other deductions</span><span class="mono">${fmtINR(p.otherDeduction)}</span></div>
              <div class="pay-row total"><span>Total deductions</span><span class="mono">${fmtINR(p.totalDeductions)}</span></div>
            </div>
          </div>
          <div class="net-box">
            <div>Net pay for ${fmtMonthLabel(state.month)}</div>
            <div class="big">${fmtINR(p.netPay)}</div>
          </div>
          <div class="note">Computer-generated demo payslip. Figures are illustrative and simplified; not for statutory filing or actual disbursement.</div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ============ RENDER: ROOT ============ */
  function render(){
    const app = document.getElementById('app');
    if(!state.ready){
      app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--muted);font-family:Georgia,serif;">Loading register\u2026</div>`;
      return;
    }
    let body = '';
    if(state.view === 'dashboard') body = renderDashboard();
    else if(state.view === 'employees') body = renderEmployees();
    else if(state.view === 'attendance') body = renderAttendance();
    else if(state.view === 'payroll') body = renderPayroll();

    app.innerHTML = `
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        <div class="content">${body}</div>
      </div>
      ${renderPayslip()}
    `;
  }

  init();
})();
</script>
</body>
</html>
